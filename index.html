<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte à rebours Coupe du Monde 2026</title>
    <style>
        /* CONFIGURATION DE L'ÉCRAN */
        body, html {
    margin: 0;
    width: 100%;
    height: 100%;
    background-image: url("drapeaux.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

            
        /* MISE EN PAGE DU TEXTE */
       .container {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    padding: 40px;
    border-radius: 30px;

    border: 1px solid rgba(255,255,255,0.2);

    box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        inset 0 0 20px rgba(255,255,255,0.05);
}

        h1 {
    color: #f56a00;
    font-size: 3rem;
    letter-spacing: 4px;
    text-shadow: 0 5px 15px rgba(0,0,0,0.6);
}
        /* LES BOITES DU COMPTE À REBOURS */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .time-box {
    background: linear-gradient(
        145deg,
        rgba(255,170,90,0.9),
        rgba(190,90,50,0.85)
    );

    padding: 20px;
    border-radius: 18px;

    min-width: 110px;

    box-shadow:
        0 6px 15px rgba(0,0,0,0.4),
        inset 0 2px 5px rgba(255,255,255,0.25);

    border: 1px solid rgba(255,255,255,0.2);
}

        .number {
    font-size: 4rem;
    font-weight: bold;
    color: white;
    text-shadow: 0 3px 10px rgba(0,0,0,0.5);
}

        .label {
            font-size: 1.2rem;
            text-transform: uppercase;
            color: white; /* Couleur dorée pour le rappel du trophée */
            margin-top: 15px;
            display: block;
            font-weight: bold;
        }
    </style>
</head>
<body>

   
    <div class="container">
        <h1>Coupe du Monde 2026</h1>
        
        <div class="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Jours</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Heures</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Secondes</span>
            </div>
        </div>
    </div>

    <script>
        // RÉGLAGE DE LA DATE : 11 Juin 2026 à 22h00
        const targetDate = new Date("June 11, 2026 22:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                clearInterval(interval);
                document.querySelector(".container").innerHTML = "<h1>C'EST PARTI ! ⚽🏆</h1>";
                return;
            }

            // Calculs mathématiques pour le temps
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            // Affichage avec un zéro devant si < 10
            document.getElementById("days").innerText = d;
            document.getElementById("hours").innerText = h < 10 ? "0" + h : h;
            document.getElementById("minutes").innerText = m < 10 ? "0" + m : m;
            document.getElementById("seconds").innerText = s < 10 ? "0" + s : s;
        }

        // Mise à jour toutes les secondes
        const interval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
