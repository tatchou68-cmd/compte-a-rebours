<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDM 2026</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black; /* Fond de secours si l'image rate */
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* ON UTILISE BODY DIRECTEMENT POUR L'IMAGE */
        body {
            background-image: url("fond2.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* LE FILTRE SOMBRE (Optionnel, on le met sur un overlay) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Assombrit l'image pour lire le texte */
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        h1 { font-size: 5vw; text-transform: uppercase; margin-bottom: 20px; }
        .timer { display: flex; gap: 20px; }
        .box { background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; min-width: 100px; border: 2px solid gold; }
        .num { font-size: 4rem; font-weight: bold; display: block; }
        .label { color: gold; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="content">
        <h1>Coupe du Monde 2026</h1>
        <div class="timer">
            <div class="box"><span class="num" id="d">0</span><span class="label">Jours</span></div>
            <div class="box"><span class="num" id="h">0</span><span class="label">Heures</span></div>
            <div class="box"><span class="num" id="m">0</span><span class="label">Min</span></div>
            <div class="box"><span class="num" id="s">0</span><span class="label">Sec</span></div>
        </div>
    </div>

    <script>
        const target = new Date("June 11, 2026 22:00:00").getTime();
        function update() {
            const now = new Date().getTime();
            const diff = target - now;
            document.getElementById('d').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('h').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('m').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById('s').innerText = Math.floor((diff % (1000 * 60)) / 1000);
        }
        setInterval(update, 1000);
        update();
    </script>
</body>
</html>
