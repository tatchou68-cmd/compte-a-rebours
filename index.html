<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupe du Monde 2026</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* ON UTILISE UN LIEN DIRECT POUR TESTER */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url("fond.jpg"); 
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 5rem);
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,1);
        }

        .timer {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .box {
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            min-width: 80px;
            border: 1px solid gold;
        }

        .num {
            font-size: 3rem;
            font-weight: bold;
            display: block;
        }

        .label {
            color: gold;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div class="container">
        <h1>FIFA 2026</h1>
        <div class="timer">
            <div class="box"><span class="num" id="d">0</span><span class="label">Jours</span></div>
            <div class="box"><span class="num" id="h">0</span><span class="label">Heures</span></div>
            <div class="box"><span class="num" id="m">0</span><span class="label">Min</span></div>
            <div class="box"><span class="num" id="s">0</span><span class="label">Sec</span></div>
        </div>
    </div>

    <script>
        const target = new Date("June 11, 2026 22:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = target - now;
            document.getElementById('d').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('h').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('m').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById('s').innerText = Math.floor((diff % (1000 * 60)) / 1000);
        }, 1000);
    </script>
</body>
</html>
